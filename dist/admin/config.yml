backend:
  name: github
  repo: write-tim/squareorb-docs
  branch: main
  base_url: https://sveltia-gatekeeper.onrender.com
  
media_folder: /assets/media
public_folder: /assets

# ---------------------------------------------------------
# Define reusable fields block using a YAML anchor (&)
# ---------------------------------------------------------
.docs_fields: &DOCS_FIELDS
  - { label: "Title", name: "title", widget: "string" }
  - { label: "Description", name: "description", widget: "string" }
  - label: "Body"
    name: "body"
    widget: "markdown"
    editor_components:
      - image
      - code-block
      - aside
      - steps
      - filetree
      - badge
      - tabs
      - linkcard
  - label: "Sidebar & Navigation Settings"
    name: "sidebar"
    widget: "object"
    collapsed: false
    required: false
    fields:
      - { label: "Short Sidebar Label", name: "label", widget: "string", required: false }
      - { label: "Sort Order", name: "order", widget: "number", value_type: "int", required: false }
      - label: "Sidebar Badge"
        name: "badge"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Badge Text", name: "text", widget: "string", required: false }
          - label: "Badge Color"
            name: "variant"
            widget: "select"
            required: false
            default: "default"
            options:
              - { label: "Default", value: "default" }
              - { label: "Tip (Purple)", value: "tip" }
              - { label: "Success (Green)", value: "success" }
              - { label: "Note (Blue)", value: "note" }
              - { label: "Caution (Orange)", value: "caution" }
              - { label: "Danger (Red)", value: "danger" }

collections:
  - name: "docs_root"
    label: "Docs - Root (Homepage)"
    label_singular: "Root Page"
    folder: "src/content/docs"
    extension: "mdx"
    format: "frontmatter"
    create: false
    delete: false
    summary: "{{title}}"
    fields: *DOCS_FIELDS

  - name: "getting-started"
    label: "1. Getting Started"
    folder: "src/content/docs/getting-started"
    extension: "mdx"
    format: "frontmatter"
    create: true
    fields: *DOCS_FIELDS

  - name: "gallery-management"
    label: "2. Gallery Management"
    folder: "src/content/docs/gallery-management"
    extension: "mdx"
    format: "frontmatter"
    create: true
    fields: *DOCS_FIELDS

  - name: "cloud-integration"
    label: "3. Cloud Integration"
    folder: "src/content/docs/cloud-integration"
    extension: "mdx"
    format: "frontmatter"
    create: true
    fields: *DOCS_FIELDS

  - name: "advanced-features"
    label: "4. Advanced Features"
    folder: "src/content/docs/advanced-features"
    extension: "mdx"
    format: "frontmatter"
    create: true
    fields: *DOCS_FIELDS
